top_category:
  name: kicad-parts
  description: Atomic parts for use in KiCad
  structural: true

top_level_params:
  - Manufacturer
  - MPN
  - MountingTypes
  - TemperatureMax
  - TemperatureMin
  - ValueAlternate
  - ValueStandard

selection_lists:
  - name: ActuatorOrientations
    description: Actuator orientation
    entries: [Side Actuated, Top Actuated]

  - name: CapacitorDielectrics
    description: Capacitor dialectric types
    entries: [X5R, X7R, C0G/NP0]

  - name: ConnectorGenders
    description: Connector genders
    entries: [Male, Female, Hermaphroditic]

  - name: LED_Colours
    description: LED colour(s)
    entries: [Red/Yellow/Green]

  - name: MountingTypes
    description: Surface Mount / Through Hole
    entries: [SMT, THT]

  - name: RelayCoilTypes
    description: Relay coil type
    entries: [Latching, Non-latching]

  - name: RelayContactForms
    description: Relay contact forms
    entries: [SPST-NO, SPST-NC, SPDT, DPDT]

  - name: SensorOutputs
    description: Sensor outputs
    entries: [I2C]
  
  - name: SensorTypes
    description: Sensor types
    entries: [Power monitoring]

  - name: SwitchFunctions
    description: Switch functions
    entries: [Off-Mom, Off-Mom-Mom, On-Mom, On-Mom_Off-Mom, On-On]

# Symbol selection lists are derived from .kicad_sym files at runtime.
# Each entry specifies the list name, description, and the symbol file path (relative to repo root).
symbol_selection_lists:
  - name: Symbols_ConnectorPower
    description: Power connector symbols
    symbol_file: connector_power.kicad_sym

  - name: Symbols_LED
    description: LED symbols
    symbol_file: led.kicad_sym

  - name: Symbols_Power
    description: Power symbols
    symbol_file: power_symbol.kicad_sym

  - name: Symbols_Relay
    description: Relay symbols
    symbol_file: relay.kicad_sym

  - name: Symbols_Sensor
    description: Sensor symbols
    symbol_file: sensor.kicad_sym

  - name: Symbols_Switch
    description: Switch symbols
    symbol_file: switch.kicad_sym

# Package selection lists are derived from footprint directories at runtime.
# Each entry specifies the list name, description, and the footprint pretty directory.
package_selection_lists:
  - name: Packages_Capacitor
    description: Capacitor packages
    pretty_dir: capacitor.pretty

  - name: Packages_CapacitorPolarized
    description: Polarized capacitor packages
    pretty_dir: capacitor_polarized.pretty

  - name: Packages_ConnectorPower
    description: Power connectors
    pretty_dir: connector_power.pretty

  - name: Packages_Diode
    description: Diode packages
    pretty_dir: diode.pretty

  - name: Packages_Inductor
    description: Inductor packages
    pretty_dir: inductor.pretty

  - name: Packages_LED
    description: LED packages
    pretty_dir: led.pretty

  - name: Packages_Relay
    description: Relay packages
    pretty_dir: relay.pretty

  - name: Packages_Resistor
    description: Resitor packages
    pretty_dir: resistor.pretty

  - name: Packages_ResistorVariable
    description: Variable resitor packages
    pretty_dir: resistor_variable.pretty

  - name: Packages_Sensor
    description: Sensor packages
    pretty_dir: package_SO.pretty

  - name: Packages_Switch
    description: Switch packages
    pretty_dir: switch.pretty

# Parameter templates.
# unit: omit or leave empty for dimensionless
# checkbox: omit to default to false
# selectionlist: name of a selection list, omit for free-text
parameter_templates:
  - name: ActuatorOrientation
    description: Actuator orientation
    selectionlist: ActuatorOrientations

  - name: Case
    description: Standard package label

  - name: ConnectorGender
    description: Connector gender
    selectionlist: ConnectorGenders

  - name: CurrentRating
    description: Current rating
    unit: A

  - name: CurrentReverseLeakage
    description: Reverse leakage current
    unit: A

  - name: CurrentSaturation
    description: Saturation current
    unit: A

  - name: DCR
    description: DC Resistance
    unit: Ω

  - name: Dielectric
    description: Capacitor dielectric type
    selectionlist: CapacitorDielectrics

  - name: LED_Colour
    description: LED colour(s)
    selectionlist: LED_Colours

  - name: Manufacturer # top-level
    description: Manufacturer name

  - name: MountingTypes # top-level
    description: Surface Mount / Through Hole
    selectionlist: MountingTypes

  - name: MPN # top-level
    description: Manufacturer Part Number

  - name: Package_Capacitor
    description: Capacitor package
    selectionlist: Packages_Capacitor

  - name: Package_CapacitorPolarized
    description: Polarized capacitor package
    selectionlist: Packages_CapacitorPolarized
  
  - name: Package_ConnectorPower
    description: Power connector package
    selectionlist: Packages_ConnectorPower

  - name: Package_Diode
    description: Diode package
    selectionlist: Packages_Diode

  - name: Package_Inductor
    description: Inductor package
    selectionlist: Packages_Inductor

  - name: Package_LED
    description: LED package
    selectionlist: Packages_LED

  - name: Package_Relay
    description: Relay package
    selectionlist: Packages_Relay

  - name: Package_Resistor
    description: Resistor package
    selectionlist: Packages_Resistor

  - name: Package_ResistorVariable
    description: Variable resistor package
    selectionlist: Packages_ResistorVariable

  - name: Package_Sensor
    description: Sensor package
    selectionlist: Packages_Sensor
  
  - name: Package_Switch
    description: Switch package
    selectionlist: Packages_Switch

  - name: PowerDecimal
    description: Power rating, decimal
    unit: W

  - name: PowerFractional
    description: Power rating, fractional
    unit: W

  - name: PowerSymbolNetName
    description: Net name

  - name: RelayCoilType
    description: Relay coil type
    selectionlist: RelayCoilTypes

  - name: RelayCoilVoltage
    description: Relay coil voltage
    unit: V

  - name: RelayContactForm
    description: Relay contact form
    selectionlist: RelayContactForms

  - name: RelaySwitchingVoltageAC
    description: Relay switching voltage (AC)
    unit: V

  - name: RelaySwitchingVoltageDC
    description: Relay switching voltage (DC)
    unit: V

  - name: ReverseRecoveryTime
    description: Reverse recovery time
    unit: s

  - name: SwitchFunction
    description: Switch function
    selectionlist: SwitchFunctions

  - name: Symbol
    description: KiCad symbol

  - name: Symbol_ConnectorPower
    description: Power connector symbol
    selectionlist: Symbols_ConnectorPower

  - name: Symbol_LED
    description: LED symbol
    selectionlist: Symbols_LED

  - name: Symbol_Power
    description: Power symbol
    selectionlist: Symbols_Power

  - name: Symbol_Relay
    description: Relay symbol
    selectionlist: Symbols_Relay

  - name: Symbol_Sensor
    description: Sensor symbol
    selectionlist: Symbols_Sensor

  - name: Symbol_Switch
    description: Switch symbol
    selectionlist: Symbols_Switch

  - name: SensorType
    description: Sensor type
    selectionlist: SensorTypes

  - name: Shielded
    description: Package shielding
    checkbox: true

  - name: TemperatureMax # top-level
    description: Temperature rating, max
    unit: °C

  - name: TemperatureMin # top-level
    description: Temperature rating, min
    unit: °C

  - name: Tolerance
    description: Value tolerance
    unit: "%"

  - name: ValueAlternate # top-level
    description: Component value, compact notation

  - name: ValueStandard # top-level
    description: Component value, decimal notation

  - name: VoltageForward
    description: Forward voltage
    unit: V

  - name: VoltageRating
    description: Voltage rating
    unit: V

  - name: VoltageReverse
    description: Max reverse voltage
    unit: V

subcategories:
  - name: Capacitor
    description: Ceramic, fixed value
    icon: ti:circuit-capacitor:outline
    params:
      - Case
      - Dielectric
      - Package_Capacitor
      - Tolerance
      - VoltageRating
    kicad:
      default_symbol: capacitor:Capacitor
      default_reference: C
      footprint_param: Package_Capacitor

  - name: CapacitorPolarized
    description: Polarized, fixed value
    icon: ti:circuit-capacitor-polarized:outline
    params:
      - Dielectric
      - Package_CapacitorPolarized
      - Tolerance
      - VoltageRating
    kicad:
      default_symbol: capacitor:CapacitorPolarized
      default_reference: CP
      footprint_param: Package_CapacitorPolarized
  
  - name: ConnectorPower
    description: Power connectors
    icon: ti:plug:outline
    params:
      - ConnectorGender
      - CurrentRating
      - Package_ConnectorPower
      - Symbol
      - Symbol_ConnectorPower
      - VoltageRating
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: J
      footprint_param: Package_ConnectorPower

  - name: DiodeRectifier
    description: Diode, rectifier
    icon: ti:circuit-diode:outline
    params:
      - CurrentRating
      - CurrentReverseLeakage
      - Package_Diode
      - ReverseRecoveryTime
      - VoltageForward
      - VoltageReverse
    kicad:
      default_symbol: diode:DiodeRectifier
      default_reference: D
      footprint_param: Package_Diode

  - name: Inductor
    description: Fixed value
    icon: ti:circuit-inductor:outline
    params:
      - CurrentRating
      - CurrentSaturation
      - DCR
      - Package_Inductor
      - Shielded
      - Tolerance
    kicad:
      default_symbol: inductor:Inductor
      default_reference: L
      footprint_param: Package_Inductor

  - name: LED
    description: Light-Emitting Diodes
    icon: ti:sun:outline
    params:
      - LED_Colour
      - Package_LED
      - Symbol
      - Symbol_LED
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: D
      footprint_param: Package_LED

  - name: PowerSymbol
    description: Power symbols
    icon: ti:circuit-ground:outline
    params:
      - PowerSymbolNetName
      - Symbol
      - Symbol_Power
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: "#PWR"
      value_param: PowerSymbolNetName

  - name: Relay
    description: Relays
    icon: ti:circuit-switch-open:outline
    params:
      - CurrentRating
      - Package_Relay
      - RelayCoilType
      - RelayCoilVoltage
      - RelayContactForm
      - RelaySwitchingVoltageAC
      - RelaySwitchingVoltageDC
      - Symbol
      - Symbol_Relay
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: K
      footprint_param: Package_Relay

  - name: Resistor
    description: Fixed value
    icon: ti:circuit-resistor:outline
    params:
      - Case
      - Package_Resistor
      - PowerDecimal
      - PowerFractional
      - Tolerance
    kicad:
      default_symbol: resistor:Resistor
      default_reference: R
      footprint_param: Package_Resistor

  - name: ResistorVariable
    description: Variable value, potentiometer
    icon: ti:circuit-resistor:outline
    params:
      - Package_ResistorVariable
      - PowerDecimal
      - PowerFractional
      - Tolerance
    kicad:
      default_symbol: resistor:ResistorVariable
      default_reference: RV
      footprint_param: Package_ResistorVariable

  - name: Sensor
    description: Sensors
    icon: ti:cpu:outline
    params:
      - Package_Sensor
      - Symbol
      - Symbol_Sensor
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: U
      footprint_param: Package_Sensor

  - name: Switch
    description: Switches
    icon: ti:circuit-pushbutton:outline
    params:
      - ActuatorOrientation
      - CurrentRating
      - Package_Switch
      - Symbol
      - Symbol_Switch
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: SW
      footprint_param: Package_Switch
