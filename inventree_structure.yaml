  - name: Packages_Diode
    description: Diode packages
    pretty_dirs:
      - diode.pretty

  - name: Packages_Fuse
    description: Fuse packages
    pretty_dirs:
      - fuse.pretty

  - name: Packages_FuseHolder
    description: Fuse holder packages
    pretty_dirs:
      - fuse_holder.pretty

  - name: Packages_Inductor
    description: Inductor packages
    pretty_dirs:
      - inductor.pretty

  - name: Packages_InterfaceEthernet
    description: Ethernet packages
    pretty_dirs:
      - package_QFP.pretty

  - name: Packages_Isolator
    description: Isolator packages
    pretty_dirs:
      - package_DIP.pretty

  - name: Packages_LED
    description: LED packages
    pretty_dirs:
      - led.pretty

  - name: Packages_Microcontroller
    description: Microcontroller packages
    pretty_dirs:
      - package_QFP.pretty

  - name: Packages_PowerModule
    description: Power module packages
    pretty_dirs:
      - power_module.pretty

  - name: Packages_RegulatorSwitching
    description: Switching regulator packages
    pretty_dirs:
      - package_SO.pretty

  - name: Packages_Relay
    description: Relay packages
    pretty_dirs:
      - relay.pretty

  - name: Packages_Resistor
    description: Resitor packages
    pretty_dirs:
      - resistor.pretty

  - name: Packages_ResistorVariable
    description: Variable resitor packages
    pretty_dirs:
