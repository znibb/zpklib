# Symbol selection lists are derived from .kicad_sym files at runtime.
# Each entry specifies the list name, description, and the symbol file path (relative to repo root).
symbol_selection_lists:
  - name: Symbols_Connector
    description: Connector symbols
    symbol_file: connector.kicad_sym

  - name: Symbols_ConnectorFan
    description: Fan connector symbols
    symbol_file: connector_fan.kicad_sym

  - name: Symbols_ConnectorPower
    description: Power connector symbols
    symbol_file: connector_power.kicad_sym

  - name: Symbols_ConnectorUSB
    description: USB connector symbols
    symbol_file: connector.kicad_sym

  - name: Symbols_Crystal
    description: Crystal symbols
    symbol_file: crystal.kicad_sym

  - name: Symbols_Fuse
    description: Fuse symbols
    symbol_file: fuse.kicad_sym

  - name: Symbols_LED
    description: LED symbols
    symbol_file: led.kicad_sym

  - name: Symbols_InterfaceEthernet
    description: Ethernet symbols
    symbol_file: interface_ethernet.kicad_sym

  - name: Symbols_Isolator
    description: Isolator symbols
    symbol_file: isolator.kicad_sym

  - name: Symbols_Microcontroller-ST
    description: ST microcontroller symbols
    symbol_file: microcontroller_st.kicad_sym

  - name: Symbols_PowerModule
    description: Power module symbols
    symbol_file: power_module.kicad_sym

  - name: Symbols_RegulatorSwitching
    description: Switching regulator symbols
    symbol_file: regulator_switching.kicad_sym

  - name: Symbols_Relay
    description: Relay symbols
    symbol_file: relay.kicad_sym

  - name: Symbols_Sensor
    description: Sensor symbols
    symbol_file: sensor.kicad_sym

  - name: Symbols_Switch
    description: Switch symbols
    symbol_file: switch.kicad_sym

  - name: Symbols_Transistor
    description: Transistor symbols
    symbol_file: transistor.kicad_sym

# Parameter templates.
# unit: omit or leave empty for dimensionless
# checkbox: omit to default to false
# selectionlist: name of a selection list, omit for free-text
parameter_templates:
  - name: ActuatorLength
    description: Actuator length
    unit: mm

  - name: ActuatorOperatingForce
    description: Actuator operating force
    unit: g
    
  - name: ActuatorOrientation
    description: Actuator orientation
    selectionlist: ActuatorOrientations

  - name: CapacitorType
    description: Capacitor type
    selectionlist: CapacitorTypes

  - name: Case
    description: Standard package label

  - name: Channels
    description: Number of channels

  - name: ConnectorGender
    description: Connector gender
    selectionlist: ConnectorGenders

  - name: CurrentOutput
    description: Current output (max)
    unit: A

  - name: CurrentRating
    description: Current rating
    unit: A

  - name: CurrentReverseLeakage
    description: Reverse leakage current
    unit: A

  - name: CurrentSaturation
    description: Saturation current
    unit: A

  - name: DCR
    description: DC Resistance
    unit: Ω

  - name: Dielectric
    description: Capacitor dielectric type
    selectionlist: CapacitorDielectrics

  - name: Efficiency
    description: Efficiency
    unit: "%"

  - name: EquivalentSeriesResistance
    description: Equivalent series resistance (ESR)
    unit: Ω

  - name: FET_Type
    description: FET Type
    selectionlist: FET_Types

  - name: Frequency
    description: Frequency
    unit: Hz

  - name: FuseCase
    description: Fuse case
    selectionlist: FuseCases

  - name: FuseType
    description: Fuse type
    selectionlist: FuseTypes

  - name: InputType
    description: Input type
    selectionlist: InputTypes

  - name: KicadExtraFields
    description: Additional KiCad fields to show (comma-separated InvenTree parameter names)

  - name: KicadHideFields
    description: KiCad default fields to hide (comma-separated, e.g. "Value")

  - name: LED_Colour
    description: LED colour(s)
    selectionlist: LED_Colours

  - name: Manufacturer # top-level
    description: Manufacturer name

  - name: MCU_NbrIO
    description: Number of I/O

  - name: MCU_SizeCore
    description: Core size
