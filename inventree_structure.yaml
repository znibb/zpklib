top_category:
  name: kicad-parts
  description: Atomic parts for use in KiCad
  structural: true

top_level_params:
  - Manufacturer
  - MPN
  - MountingTypes
  - TemperatureMax
  - TemperatureMin
  - ValueAlternate
  - ValueStandard

selection_lists:
  - name: ActuatorOrientations
    description: Actuator orientation
    entries: [Side Actuated, Top Actuated]

  - name: CapacitorDielectrics
    description: Capacitor dialectric types
    entries: [X5R, X7R, C0G/NP0]

  - name: CapacitorTypes
    description: Capacitor types
    entries: [Polymer, Hybrid]

  - name: ConnectorGenders
    description: Connector genders
    entries: [Male, Female, Hermaphroditic]

  - name: FET_Types
    description: FET types
    entries: [N-channel, P-channel]

  - name: FuseCases
    description: Fuse cases
    entries: [5x20mm]

  - name: FuseTypes
    description: Fuse types
    entries: [Slow blow, Fast blow]

  - name: InputTypes
    description: Input types
    entries: [DC, "AC, DC"]

  - name: LED_Colours
    description: LED colour(s)
    entries: [Red/Yellow/Green]

  - name: MCU_SizeCores
    description: MCU core sizes
    entries: [32-bit]

  - name: MountingTypes
    description: Surface Mount / Through Hole
    entries: [SMT, THT]

  - name: RelayCoilTypes
    description: Relay coil type
    entries: [Latching, Non-latching]

  - name: RelayContactForms
    description: Relay contact forms
    entries: [SPST-NO, SPST-NC, SPDT, DPDT]

  - name: SensorOutputs
    description: Sensor outputs
    entries: [I2C]
  
  - name: SensorTypes
    description: Sensor types
    entries: [Power monitoring]

  - name: SwitchFunctions
    description: Switch functions
    entries: [Off-Mom, Off-Mom-Mom, On-Mom, On-Mom_Off-Mom, On-On]

  - name: SwitchingRegulatorFunctions
    description: Switching regulator functions
    entries: [Step-up, Step-down]

# Package selection lists are derived from footprint directories at runtime.
# Each entry specifies the list name, description, and one or more footprint pretty directories.
package_selection_lists:
  - name: Packages_Capacitor
    description: Capacitor packages
    pretty_dirs:
      - capacitor.pretty

  - name: Packages_CapacitorPolarized
    description: Polarized capacitor packages
    pretty_dirs:
      - capacitor_polarized.pretty

  - name: Packages_Connector
    description: Connector packages
    pretty_dirs:
      - connector.pretty
      - connector_jst.pretty

  - name: Packages_ConnectorFan
    description: Fan connector packages
    pretty_dirs:
      - connector_fan.pretty

  - name: Packages_ConnectorPinHeader
    description: Pin header packages
    pretty_dirs:
      - connector_pinheader.pretty

  - name: Packages_ConnectorPower
    description: Power connector packages
    pretty_dirs:
      - connector_power.pretty

  - name: Packages_ConnectorUSB
    description: USB connector packages
    pretty_dirs:
