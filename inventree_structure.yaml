# subcategories
subcategories:
  - name: Capacitor
    description: Ceramic, fixed value
    icon: ti:circuit-capacitor:outline
    params:
      - Case
      - Dielectric
      - Package_Capacitor
      - Tolerance
      - VoltageRating
    kicad:
      default_symbol: capacitor:Capacitor
      default_reference: C
      footprint_param: Package_Capacitor
      show_extra_fields: Case, VoltageRating

  - name: CapacitorPolarized
    description: Polarized, fixed value
    icon: ti:circuit-capacitor-polarized:outline
    params:
      - CapacitorType
      - EquivalentSeriesResistance
      - Package_CapacitorPolarized
      - Tolerance
      - VoltageRating
    kicad:
      default_symbol: capacitor:CapacitorPolarized
      default_reference: CP
      footprint_param: Package_CapacitorPolarized
  
  - name: Connector
    description: Connector, generic
    icon: ti:plug:outline
    params:
      - NbrOfPositions
      - Package_Connector
      - Symbol
      - Symbol_Connector
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: J
      footprint_param: Package_Connector

  - name: ConnectorFan
    description: Fan connector
    icon: ti:car-fan:outline
    params:
      - NbrOfPositions
      - Package_ConnectorFan
      - Symbol
      - Symbol_ConnectorFan
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: J
      footprint_param: Package_ConnectorFan

  - name: ConnectorPinHeader
    description: Pin headers
    icon: ti:plug:outline
    params:
      - NbrOfPositions
      - Package_ConnectorPinHeader
      - Symbol
      - Symbol_Connector
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: J
      footprint_param: Package_ConnectorPinHeader
      hide_fields: Value

  - name: ConnectorPower
    description: Power connectors
    icon: ti:plug:outline
    params:
      - ConnectorGender
      - CurrentRating
      - Package_ConnectorPower
      - Symbol
      - Symbol_ConnectorPower
      - VoltageRating
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: J
      footprint_param: Package_ConnectorPower

  - name: ConnectorUSB
    description: USB conenctors
    icon: ti:usb:outline
    params:
      - ConnectorGender
      - CurrentRating
      - Package_ConnectorUSB
      - Symbol
      - Symbol_ConnectorUSB
      - VoltageRating
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: J
      footprint_param: Package_ConnectorUSB

  - name: Crystal
    description: Crystals, oscillators
    icon: ti:diamond:outline
    params:
      - Frequency
      - Package_Crystal
      - Symbol
      - Symbol_Crystal
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: X
      footprint_param: Package_Crystal

  - name: DiodeRectifier
    description: Diode, rectifier
    icon: ti:circuit-diode:outline
    params:
      - CurrentRating
      - CurrentReverseLeakage
      - Package_Diode
      - ReverseRecoveryTime
      - VoltageForward
      - VoltageReverse
    kicad:
      default_symbol: diode:DiodeRectifier
      default_reference: D
      footprint_param: Package_Diode

  - name: DiodeSchottky
    description: Diode, schottky
    icon: ti:circuit-diode:outline
    params:
      - CurrentRating
      - CurrentReverseLeakage
      - Package_Diode
      - ReverseRecoveryTime
      - VoltageForward
      - VoltageReverse
    kicad:
      default_symbol: diode:DiodeSchottky
      default_reference: D
      footprint_param: Package_Diode

  - name: Fuse
    description: Fuse
    icon: ti:shield:outline
    params:
      - CurrentRating
      - FuseCase
      - FuseType
      - Package_Fuse
      - Symbol
      - Symbol_Fuse
      - VoltageRating
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: F
      footprint_param: Package_Fuse

  - name: FuseHolder
    description: Fuse holder
    icon: ti:shield:outline
    params:
      - CurrentRating
      - FuseCase
      - Package_FuseHolder
      - VoltageRating
    kicad:
      default_symbol: fuse_holder:FuseHolder
      default_reference: FH
      footprint_param: Package_FuseHolder
      hide_fields: Value

  - name: Inductor
    description: Fixed value
    icon: ti:circuit-inductor:outline
    params:
      - CurrentRating
      - CurrentSaturation
      - DCR
      - Package_Inductor
      - Shielded
      - Tolerance
    kicad:
      default_symbol: inductor:Inductor
      default_reference: L
      footprint_param: Package_Inductor

  - name: InterfaceEthernet
    description: Ethernet ICs
    icon: ti:cpu:outline
    params:
      - Package_InterfaceEthernet
      - Symbol
      - Symbol_InterfaceEthernet
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: U
      footprint_param: Package_InterfaceEthernet

  - name: Isolator
    description: Isolator, optocoupler
    icon: ti:cpu:outline
    params:
      - Channels
      - CurrentOutput
      - InputType
      - Symbol
      - Symbol_Isolator
      - Package_Isolator
      - VoltageIsolation
      - VoltageOutput
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: U
      footprint_param: Package_Isolator

  - name: LED
    description: Light-Emitting Diodes
    icon: ti:sun:outline
    params:
      - LED_Colour
      - Package_LED
      - Symbol
      - Symbol_LED
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: D
      footprint_param: Package_LED

  - name: Microcontroller-ST
    description: ST microcontrollers
    icon: ti:cpu:outline
    params:
      - MCU_NbrIO
      - MCU_SizeCore
      - MCU_SizeFlash
      - MCU_SizeRAM
      - MCU_Speed
      - Package_Microcontroller
      - Symbol
      - Symbol_Microcontroller-ST
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: U
      footprint_param: Package_Microcontroller
      hide_fields: Value

  - name: PowerModule
    description: Power modules
    icon: ti:bolt:outline
    params:
      - CurrentOutput
      - Package_PowerModule
      - Power
      - Symbol
      - Symbol_PowerModule
      - VoltageOutput
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: U
      footprint_param: Package_PowerModule
      show_extra_fields: Power

  - name: RegulatorSwitching
    description: Switching regulators
    icon: ti:cpu:outline
    params:
      - Channels
      - CurrentOutput
      - Package_RegulatorSwitching
      - SwitchingRegulatorFunction
      - Symbol
      - Symbol_RegulatorSwitching
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: U
      footprint_param: Package_RegulatorSwitching

  - name: Relay
    description: Relays
    icon: ti:circuit-switch-open:outline
    params:
      - CurrentRating
      - Package_Relay
      - RelayCoilType
      - RelayCoilVoltage
      - RelayContactForm
      - RelaySwitchingVoltageAC
      - RelaySwitchingVoltageDC
      - Symbol
      - Symbol_Relay
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: K
      footprint_param: Package_Relay

  - name: Resistor
    description: Fixed value
    icon: ti:circuit-resistor:outline
    params:
      - Case
      - Package_Resistor
      - Power
      - Tolerance
    kicad:
      default_symbol: resistor:Resistor
      default_reference: R
      footprint_param: Package_Resistor
      show_extra_fields: "Case"

  - name: ResistorVariable
    description: Variable value, potentiometer
    icon: ti:circuit-resistor:outline
    params:
      - Package_ResistorVariable
      - Power
      - Tolerance
    kicad:
      default_symbol: resistor:ResistorVariable
      default_reference: RV
      footprint_param: Package_ResistorVariable

  - name: Sensor
    description: Sensors
    icon: ti:cpu:outline
    params:
      - Package_Sensor
      - Symbol
      - Symbol_Sensor
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: U
      footprint_param: Package_Sensor

  - name: SwitchPush
    description: Switches
    icon: ti:circuit-pushbutton:outline
    params:
      - ActuatorLength
      - ActuatorOperatingForce
      - ActuatorOrientation
      - CurrentRating
      - Package_Switch
    kicad:
      default_symbol: switch:SW_Push
      default_reference: SW
      footprint_param: Package_Switch

  - name: Transistor
    description: Transistors
    icon: 
    params:
      - CurrentRating
      - FET_Type
      - Package_Transistor
      - Symbol
      - Symbol_Transistor
      - VoltageDrainSource
      - VoltageGateSource
      - VoltageGateSourceThreshold
    kicad:
      default_symbol: placeholder:BlankSymbol
      default_reference: Q
      footprint_param: Package_Transistor